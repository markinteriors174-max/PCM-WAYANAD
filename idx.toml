[preview]
enable = true

[[preview.previews]]
id = "android"
manager = "android"
command = ["flutter", "run", "-d", "android", "-v"]

[[preview.previews]]
id = "web"
manager = "web"
command = ["flutter", "run", "-d", "web-server", "--web-port", "$PORT"]
