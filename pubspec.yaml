name: pcm_wayanad
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.3.2
  pdf: ^3.10.8
  printing: ^5.11.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  path: ^1.9.1
  share_plus: ^10.1.0
  flutter_native_contact_picker: ^0.0.11
  qr_flutter: ^4.1.0
  geolocator: ^14.0.2
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  mobile_scanner: ^6.0.0
  url_launcher: ^6.3.2
  firebase_core: ^2.24.2
  flutter_tts: ^4.0.2
  cloud_firestore: ^4.14.0
  provider: ^6.1.1
  file_picker: ^8.0.0
  google_fonts: ^6.1.0
  camera: ^0.12.0+1
  agora_rtc_engine: ^6.3.2
  flutter_secure_storage: ^9.2.2
  # Firebase dependencies managed for absolute stability; using try-catch initialization.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/3d/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/logo.png"
  android: true
  ios: true
