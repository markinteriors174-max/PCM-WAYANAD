<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCM Wayanad CAD Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #0b0d13;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas3d {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpgeh6vom5Zm+M0DCKIdPTe5GVDe86CX507q32AgGIOQ1aHBQKkV2UV05MmHpqVVJUH5zs/CpqA==" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" integrity="sha256-9Iu96c0F44p00p4gU6xHn4eA1G8x8Y6D8G0wG8h+J4o=" crossorigin="anonymous"></script>
</head>
<body>
  <div id="canvas3d"></div>

  <script>
    let scene, camera, renderer, controls;
    let roomGroup, ledLightGroup;
    let isLightsOn = true;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e1118);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(22, 20, 26);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.getElementById('canvas3d').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 4, 0);

      // ലൈറ്റിംഗ്
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
      sunLight.position.set(15, 25, 15);
      sunLight.castShadow = true;
      scene.add(sunLight);

      roomGroup = new THREE.Group();
      ledLightGroup = new THREE.Group();
      scene.add(roomGroup);
      scene.add(ledLightGroup);

      // ഡിഫോൾട്ട് റൂം നിർമ്മിക്കുന്നു
      buildFullRoom({
        lengthFeet: 14,
        widthFeet: 12,
        heightFeet: 10,
        hasCoveCeiling: true,
        furniture: [{ type: 'sofa', x: 0, y: 0 }]
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function buildFullRoom(data) {
      // പഴയ മെഷുകൾ നീക്കം ചെയ്യുന്നു
      while (roomGroup.children.length > 0) roomGroup.remove(roomGroup.children[0]);
      while (ledLightGroup.children.length > 0) ledLightGroup.remove(ledLightGroup.children[0]);

      const L = data.lengthFeet || 14;
      const W = data.widthFeet || 12;
      const H = data.heightFeet || 10;

      // 1. തറ (Flooring Mesh)
      const floorGeo = new THREE.PlaneGeometry(L, W);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x3e2723, // വുഡൻ ടൈൽ ഫിനിഷ്
        roughness: 0.3,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      roomGroup.add(floor);

      // 2. ചുമരുകൾ (Walls with thickness)
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xede8e1, roughness: 0.8 });
      const wallThickness = 0.75; // 9 ഇഞ്ച്

      // പിൻ ചുമര് (Back Wall)
      const backWallGeo = new THREE.BoxGeometry(L + wallThickness, H, wallThickness);
      const backWall = new THREE.Mesh(backWallGeo, wallMat);
      backWall.position.set(0, H/2, -W/2 - wallThickness/2);
      backWall.receiveShadow = true;
      roomGroup.add(backWall);

      // ഇടത് ചുമര് (Left Wall with Door Cutout representation)
      const leftWallGeo = new THREE.BoxGeometry(wallThickness, H, W);
      const leftWall = new THREE.Mesh(leftWallGeo, wallMat);
      leftWall.position.set(-L/2 - wallThickness/2, H/2, 0);
      leftWall.receiveShadow = true;
      roomGroup.add(leftWall);

      // വലത് ചുമര് (Right Wall)
      const rightWallGeo = new THREE.BoxGeometry(wallThickness, H, W);
      const rightWall = new THREE.Mesh(rightWallGeo, wallMat);
      rightWall.position.set(L/2 + wallThickness/2, H/2, 0);
      rightWall.receiveShadow = true;
      roomGroup.add(rightWall);

      // 3. ഫോൾസ് സീലിംഗും കോവ് ലൈറ്റുകളും (Gypsum False Ceiling)
      if (data.hasCoveCeiling) {
        // സീലിംഗ് പെരിമീറ്റർ ഡ്രോപ്പ് ബോക്സ് (Outer Border)
        const outerMargin = 1.5; // 18 ഇഞ്ച്
        const dropHeight = 0.5;  // 6 ഇഞ്ച് ഡ്രോപ്പ്

        const ceilingSlabGeo = new THREE.BoxGeometry(L, 0.2, W);
        const ceilingSlabMat = new THREE.MeshStandardMaterial({ color: 0x1a1c23 });
        const ceilingSlab = new THREE.Mesh(ceilingSlabGeo, ceilingSlabMat);
        ceilingSlab.position.set(0, H, 0);
        roomGroup.add(ceilingSlab);

        // കോവ് ട്രേ ബോക്സ്
        const coveGeo = new THREE.BoxGeometry(L - outerMargin, dropHeight, W - outerMargin);
        const coveMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 });
        const coveMesh = new THREE.Mesh(coveGeo, coveMat);
        coveMesh.position.set(0, H - dropHeight/2, 0);
        roomGroup.add(coveMesh);

        // ഉള്ളിലെ എൽഇഡി സ്ട്രിപ്പ് പ്രകാശം (Warm Yellow LED Glow)
        const ledLight = new THREE.PointLight(0xffb300, 2.5, 20);
        ledLight.position.set(0, H - dropHeight + 0.1, 0);
        ledLightGroup.add(ledLight);

        // നടുവിലെ ഫാൻ പോയിന്റ്
        const fanGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.2, 16);
        const fanMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const fan = new THREE.Mesh(fanGeo, fanMat);
        fan.position.set(0, H - dropHeight, 0);
        roomGroup.add(fan);
      }

      // 4. ഫർണിച്ചർ ബ്ലോക്കുകൾ (Furniture 3D)
      if (data.furniture && Array.isArray(data.furniture)) {
        data.furniture.forEach(item => {
          if (item.type === 'sofa') {
            const sofaGeo = new THREE.BoxGeometry(4.5, 1.6, 2.2);
            const sofaMat = new THREE.MeshStandardMaterial({ color: 0x37474f });
            const sofa = new THREE.Mesh(sofaGeo, sofaMat);
            sofa.position.set(0, 0.8, 1.5);
            sofa.castShadow = true;
            roomGroup.add(sofa);
          } else if (item.type === 'bed') {
            const bedGeo = new THREE.BoxGeometry(5.5, 1.4, 6.2);
            const bedMat = new THREE.MeshStandardMaterial({ color: 0x5d4037 });
            const bed = new THREE.Mesh(bedGeo, bedMat);
            bed.position.set(0, 0.7, 0);
            bed.castShadow = true;
            roomGroup.add(bed);
          }
        });
      }
    }

    // ഫ്ലട്ടറിൽ നിന്ന് നിയന്ത്രിക്കാനുള്ള API ഫംഗ്ഷനുകൾ
    window.updateRoomData = function(jsonStr) {
      try {
        const data = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
        buildFullRoom(data);
      } catch (e) {
        console.error("Error parsing room data:", e);
      }
    };

    window.toggleLights = function(state) {
      isLightsOn = state;
      ledLightGroup.visible = isLightsOn;
    };

    window.startWalkthrough = function() {
      let t = 0;
      const interval = setInterval(() => {
        t += 0.03;
        camera.position.x = 18 * Math.sin(t);
        camera.position.z = 18 * Math.cos(t);
        camera.position.y = 8 + 2 * Math.sin(t*2);
        camera.lookAt(0, 4, 0);
        if (t > Math.PI * 2) clearInterval(interval);
      }, 30);
    };

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
